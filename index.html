<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unusual spelling highlighter</title>
  <meta name="description" content="Classifier for structurally unusual spellings.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="banner">
    <div class="wrap">
      <h1>Unusual spelling highlighter</h1>
    </div>
  </header>

  <main class="wrap">
    <section class="workspace" aria-label="Classifier">
      <div class="pane">
        <h2>Text</h2>
        <label class="sr-only" for="input">Text to scan</label>
        <textarea id="input" maxlength="4000" rows="8" spellcheck="false"></textarea>
      </div>
      <div class="pane">
        <h2>Marked spellings</h2>
        <div id="output" class="output" aria-live="polite"></div>
      </div>
    </section>

    <div class="controls">
      <button type="button" id="scan" class="primary" disabled>Scan</button>
      <p id="status">Loading dictionary.</p>
    </div>

    <section class="results">
      <div class="table-wrap">
        <table id="table">
          <thead>
            <tr>
              <th>Marked spelling</th>
              <th>Guessed ordinary word</th>
              <th>Why it looks unusual</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
